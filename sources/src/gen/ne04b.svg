<svg viewBox="0 0 520 344" role="img" style="width:100%;height:auto"><title>Algorithme : thrombolyse et thrombectomie</title><text x="0.0" y="11.0" text-anchor="start" font-size="9" font-weight="700" fill="#1d2430" font-family="IS">Décision : thrombolyse, thrombectomie ou les deux · AHA/ASA 2026</text><rect x="20" y="20" width="250" height="30" rx="5" fill="#f4f6f8" stroke="#d5dae1" stroke-width="0.8"/><text x="145.0" y="32.0" text-anchor="middle" font-size="7" font-weight="700" fill="#1d2430" font-family="IS">Scanner sans injection</text><text x="145.0" y="42.0" text-anchor="middle" font-size="6.2" font-weight="400" fill="#7a8492" font-family="IS">hémorragie ? · ASPECTS · dans les 25 minutes</text><path d="M272,35 L290.5,35" stroke="#4a5462" stroke-width="1" fill="none"/><path d="M289.5,32.2 L294,35 L289.5,37.8Z" fill="#4a5462"/><text x="283.0" y="30.0" text-anchor="middle" font-size="6" font-weight="400" fill="#7a8492" font-family="IS">oui</text><rect x="296" y="20" width="204" height="30" rx="5" fill="#F6C1C1" stroke="#8B1A1A" stroke-width="0.8"/><text x="398.0" y="32.0" text-anchor="middle" font-size="7" font-weight="700" fill="#8B1A1A" font-family="IS">Hémorragie</text><text x="398.0" y="42.0" text-anchor="middle" font-size="6.2" font-weight="400" fill="#8B1A1A" font-family="IS">ni thrombolyse ni thrombectomie</text><path d="M145,50 L145,57.5" stroke="#4a5462" stroke-width="1" fill="none"/><path d="M142.2,56.5 L145,61 L147.8,56.5Z" fill="#4a5462"/><text x="152.0" y="58.0" text-anchor="start" font-size="6" font-weight="400" fill="#7a8492" font-family="IS">non</text><rect x="20" y="62" width="480" height="32" rx="5" fill="#f4f6f8" stroke="#d5dae1" stroke-width="0.8"/><text x="260.0" y="74.0" text-anchor="middle" font-size="7.2" font-weight="700" fill="#1d2430" font-family="IS">Angioscanner · NIHSS · âge · mRS préalable · heure du dernier contact normal</text><text x="260.0" y="86.0" text-anchor="middle" font-size="6.4" font-weight="400" fill="#7a8492" font-family="IS">les deux voies s'évaluent en parallèle — aucune ne retarde l'autre</text><path d="M145,94 L145,99.5" stroke="#4a5462" stroke-width="1" fill="none"/><path d="M142.2,98.5 L145,103 L147.8,98.5Z" fill="#4a5462"/><path d="M392,94 L392,99.5" stroke="#4a5462" stroke-width="1" fill="none"/><path d="M389.2,98.5 L392,103 L394.8,98.5Z" fill="#4a5462"/><rect x="20" y="104" width="205" height="14" rx="5" fill="#D4F0DF" stroke="#d5dae1" stroke-width="0.8"/><text x="122.0" y="114.0" text-anchor="middle" font-size="6.6" font-weight="700" fill="#1C6B3E" font-family="IS">VOIE THROMBECTOMIE · cible : ACI / M1</text><rect x="20" y="124" width="245" height="30" rx="5" fill="#f4f6f8" stroke="#d5dae1" stroke-width="0.8"/><text x="28.0" y="136.0" text-anchor="start" font-size="6.9" font-weight="700" fill="#1d2430" font-family="IS">Occlusion proximale (ACI terminale ou M1) ?</text><text x="28.0" y="148.0" text-anchor="start" font-size="6.2" font-weight="400" fill="#7a8492" font-family="IS">distale ou absente : pas d'EVT systématique</text><rect x="20" y="160" width="245" height="34" rx="5" fill="#D4F0DF" stroke="#d5dae1" stroke-width="0.8"/><text x="28.0" y="173.0" text-anchor="start" font-size="6.8" font-weight="700" fill="#1C6B3E" font-family="IS">0–6 h · ASPECTS 3–10 · NIHSS ≥ 6 · mRS 0–1</text><text x="28.0" y="185.0" text-anchor="start" font-size="6.2" font-weight="400" fill="#7a8492" font-family="IS">classe 1 A · thrombectomie recommandée</text><rect x="208" y="169" width="49" height="15" rx="3" fill="#1C6B3E"/><text x="232.5" y="180.2" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="IS">EVT ✓</text><rect x="20" y="200" width="245" height="22" rx="5" fill="#D4F0DF" stroke="#d5dae1" stroke-width="0.8"/><text x="28.0" y="214.0" text-anchor="start" font-size="6.8" font-weight="700" fill="#1C6B3E" font-family="IS">6–24 h · ASPECTS ≥ 6 · classe 1 A</text><rect x="208" y="203" width="49" height="15" rx="3" fill="#1C6B3E"/><text x="232.5" y="214.2" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="IS">EVT ✓</text><rect x="20" y="228" width="245" height="34" rx="5" fill="#D4F0DF" stroke="#d5dae1" stroke-width="0.8"/><text x="28.0" y="241.0" text-anchor="start" font-size="6.8" font-weight="700" fill="#1C6B3E" font-family="IS">6–24 h · ASPECTS 3–5 · &lt; 80 ans</text><text x="28.0" y="253.0" text-anchor="start" font-size="6.2" font-weight="400" fill="#7a8492" font-family="IS">sans effet de masse · patients sélectionnés</text><rect x="208" y="237" width="49" height="15" rx="3" fill="#1C6B3E"/><text x="232.5" y="248.2" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="IS">EVT ✓</text><rect x="20" y="268" width="245" height="34" rx="5" fill="#f4f6f8" stroke="#d5dae1" stroke-width="0.8"/><text x="28.0" y="280.0" text-anchor="start" font-size="6.8" font-weight="700" fill="#1d2430" font-family="IS">hors cases → CTP validé ou IRM de diffusion</text><text x="28.0" y="292.0" text-anchor="start" font-size="6.3" font-weight="400" fill="#1d2430" font-family="IS">profils DAWN / DEFUSE 3 → EVT ✓ · sinon pas d'EVT</text><rect x="285" y="104" width="150" height="14" rx="5" fill="#DCE8F8" stroke="#d5dae1" stroke-width="0.8"/><text x="360.0" y="114.0" text-anchor="middle" font-size="6.6" font-weight="700" fill="#1F4E8C" font-family="IS">VOIE THROMBOLYSE</text><rect x="285" y="124" width="215" height="46" rx="5" fill="#DCE8F8" stroke="#d5dae1" stroke-width="0.8"/><text x="293.0" y="138.0" text-anchor="start" font-size="6.8" font-weight="700" fill="#1F4E8C" font-family="IS">dernier contact normal &lt; 4,5 h</text><text x="293.0" y="149.0" text-anchor="start" font-size="6.3" font-weight="400" fill="#1d2430" font-family="IS">IVT immédiate · TNK 0,25 mg/kg · max 25 mg</text><text x="293.0" y="160.0" text-anchor="start" font-size="6.2" font-weight="400" fill="#7a8492" font-family="IS">sans attendre l'imagerie avancée</text><rect x="452" y="139" width="42" height="15" rx="3" fill="#1F4E8C"/><text x="473.0" y="150.2" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="IS">IVT ✓</text><rect x="285" y="176" width="215" height="46" rx="5" fill="#f4f6f8" stroke="#d5dae1" stroke-width="0.8"/><text x="293.0" y="190.0" text-anchor="start" font-size="6.8" font-weight="700" fill="#1F4E8C" font-family="IS">4,5–9 h ou réveil</text><text x="293.0" y="201.0" text-anchor="start" font-size="6.1" font-weight="400" fill="#1d2430" font-family="IS">cœur &lt; 70 mL · ratio &gt; 1,2 · mismatch &gt; 10 mL</text><text x="293.0" y="212.0" text-anchor="start" font-size="6.2" font-weight="400" fill="#7a8492" font-family="IS">ou mismatch FLAIR–DWI à l'IRM (EXTEND)</text><rect x="452" y="191" width="42" height="15" rx="3" fill="#1F4E8C"/><text x="473.0" y="202.2" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="IS">IVT ✓</text><rect x="285" y="228" width="215" height="46" rx="5" fill="#f4f6f8" stroke="#d5dae1" stroke-width="0.8"/><text x="293.0" y="242.0" text-anchor="start" font-size="6.8" font-weight="700" fill="#1F4E8C" font-family="IS">4,5–24 h · classe 2b</text><text x="293.0" y="253.0" text-anchor="start" font-size="6.3" font-weight="400" fill="#1d2430" font-family="IS">LVO + tissu sauvable, sans option d'EVT</text><text x="293.0" y="264.0" text-anchor="start" font-size="6.2" font-weight="400" fill="#7a8492" font-family="IS">(transfert impossible, cas marginal)</text><rect x="452" y="243" width="42" height="15" rx="3" fill="#7a8492"/><text x="473.0" y="254.2" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="IS">IVT ?</text><rect x="285" y="282" width="215" height="16" rx="5" fill="#f4f6f8" stroke="#d5dae1" stroke-width="0.8"/><text x="392.0" y="293.0" text-anchor="middle" font-size="6.2" font-weight="400" fill="#7a8492" font-family="IS">contre-indications de l'IVT → fiche NE-01</text><rect x="20" y="308" width="480" height="26" rx="5" fill="#D4F0DF" stroke="#d5dae1" stroke-width="0.8"/><text x="260.0" y="325.0" text-anchor="middle" font-size="7" font-weight="700" fill="#1C6B3E" font-family="IS">Éligible aux deux = les deux (bridging) · l'IVT part sans attendre et ne retarde jamais l'EVT</text><text x="0.0" y="341.0" text-anchor="start" font-size="6" font-weight="400" fill="#7a8492" font-family="IS">Schémas simplifiés, non à l'échelle · adulte, circulation antérieure · cohérence finale avec l'occlusion, l'ASPECTS et la clinique</text></svg>