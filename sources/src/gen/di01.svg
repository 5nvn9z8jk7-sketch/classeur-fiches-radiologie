<svg viewBox="0 0 520 254" role="img" style="width:100%;height:auto"><title>Stade T du cancer du rectum</title><text x="0.0" y="11.0" text-anchor="start" font-size="9.5" font-weight="700" fill="#1d2430" font-family="IS">Paroi rectale, mésorectum et stade T (coupe perpendiculaire)</text><rect x="20" y="30" width="480" height="30" fill="#2a2f38"/><text x="26.0" y="48.0" text-anchor="start" font-size="8" font-weight="600" fill="#fff" font-family="IS">Lumière</text><rect x="20" y="60" width="480" height="22" fill="#e9edf2"/><text x="26.0" y="74.0" text-anchor="start" font-size="8" font-weight="600" fill="#1d2430" font-family="IS">Muqueuse / sous-muqueuse</text><rect x="20" y="82" width="480" height="22" fill="#5b6573"/><text x="26.0" y="96.0" text-anchor="start" font-size="8" font-weight="600" fill="#fff" font-family="IS">Musculeuse propre</text><rect x="20" y="104" width="480" height="92" fill="#FCEFC7"/><text x="26.0" y="153.0" text-anchor="start" font-size="8" font-weight="600" fill="#7A5200" font-family="IS">Graisse mésorectale</text><line x1="20" y1="196" x2="500" y2="196" stroke="#7a3b8f" stroke-width="2.5"/><text x="26.0" y="208.0" text-anchor="start" font-size="8" font-weight="700" fill="#7a3b8f" font-family="IS">Fascia mésorectal (MRF) : envahi si marge ≤ 1 mm</text><path d="M190,60 L224,60 L220,82 Q207,88 194,82Z" fill="#c2410c" opacity="0.85"/><text x="207.0" y="52.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff" font-family="IS">T1</text><path d="M242,60 L276,60 L272,104 Q259,110 246,104Z" fill="#c2410c" opacity="0.85"/><text x="259.0" y="52.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff" font-family="IS">T2</text><path d="M294,60 L328,60 L324,105 Q311,111 298,105Z" fill="#c2410c" opacity="0.85"/><text x="311.0" y="52.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff" font-family="IS">T3a</text><path d="M346,60 L380,60 L376,119 Q363,125 350,119Z" fill="#c2410c" opacity="0.85"/><text x="363.0" y="52.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff" font-family="IS">T3b</text><path d="M398,60 L432,60 L428,149 Q415,155 402,149Z" fill="#c2410c" opacity="0.85"/><text x="415.0" y="52.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff" font-family="IS">T3c</text><path d="M450,60 L484,60 L480,182 Q467,188 454,182Z" fill="#c2410c" opacity="0.85"/><text x="467.0" y="52.0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff" font-family="IS">T3d</text><text x="415.0" y="186.0" text-anchor="middle" font-size="7" font-weight="400" fill="#7a8492" font-family="IS"></text><text x="20.0" y="224.0" text-anchor="start" font-size="7.8" font-weight="400" fill="#1d2430" font-family="IS">T3 : a &lt; 1 mm · b 1–5 mm · c 5–15 mm · d &gt; 15 mm au-delà de la musculeuse</text><text x="20.0" y="236.0" text-anchor="start" font-size="7.8" font-weight="400" fill="#1d2430" font-family="IS">T4a : péritoine viscéral · T4b : organe voisin, sphincter externe, releveurs</text><text x="20.0" y="249.0" text-anchor="start" font-size="7.2" font-weight="400" fill="#7a8492" font-family="IS">Schémas simplifiés, non à l'échelle</text></svg>