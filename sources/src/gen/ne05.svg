<svg viewBox="0 0 520 300" role="img" style="width:100%;height:auto" font-family="IS"><title>Signes IRM et DaT des syndromes parkinsoniens</title>
<text x="0" y="11" font-size="9.5" font-weight="700" fill="#1d2430">Signes à reconnaître · schémas (antérieur en haut sur les coupes axiales)</text>
<!-- Panel A : sagittal median -->
<g transform="translate(0,18)">
<rect x="0" y="0" width="168" height="134" rx="6" fill="#fff" stroke="#d5dae1" stroke-width="0.8"/>
<text x="8" y="13" font-size="8.2" font-weight="700" fill="#5b3fa0">A · Sagittal médian T1</text>
<!-- normal -->
<path d="M26,66 L30,44 Q42,32 58,40 L62,66 Z" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.7"/>
<path d="M60,40 q6,4 4,14 q-2,6 -4,8" fill="none" stroke="#4a5462" stroke-width="0.7"/>
<path d="M27,66 C12,70 12,96 32,99 L60,98 Q66,82 62,66 Z" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.7"/>
<path d="M34,98 L56,98 L54,118 L38,118 Z" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.7"/>
<line x1="24" y1="68" x2="66" y2="57" stroke="#c2410c" stroke-width="0.8" stroke-dasharray="2 1.5"/>
<text x="44" y="127" text-anchor="middle" font-size="6.8" fill="#1d2430">Normal : convexe</text>
<!-- PSP -->
<path d="M112,66 L118,52 Q127,58 140,48 L144,66 Z" fill="#e5dcf7" stroke="#5b3fa0" stroke-width="0.8"/>
<path d="M118,52 L106,47" stroke="#5b3fa0" stroke-width="0.8"/>
<path d="M140,48 q5,4 4,12 q-1,4 -2,6" fill="none" stroke="#5b3fa0" stroke-width="0.7"/>
<path d="M111,66 C96,70 96,96 116,99 L144,98 Q150,82 146,66 Z" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.7"/>
<path d="M118,98 L140,98 L138,118 L122,118 Z" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.7"/>
<line x1="108" y1="68" x2="150" y2="58" stroke="#c2410c" stroke-width="0.8" stroke-dasharray="2 1.5"/>
<text x="150" y="40" text-anchor="end" font-size="6.6" fill="#5b3fa0" font-weight="700">« bec »</text>
<text x="126" y="127" text-anchor="middle" font-size="6.8" fill="#5b3fa0" font-weight="700">PSP : colibri</text>
<text x="84" y="24" text-anchor="middle" font-size="6.2" fill="#c2410c">--- ligne incisure pontique sup. → lame quadrigéminale</text>
</g>
<!-- Panel B : axial mesencephale -->
<g transform="translate(176,18)">
<rect x="0" y="0" width="168" height="134" rx="6" fill="#fff" stroke="#d5dae1" stroke-width="0.8"/>
<text x="8" y="13" font-size="8.2" font-weight="700" fill="#5b3fa0">B · Axial mésencéphale T2</text>
<!-- normal -->
<ellipse cx="32" cy="52" rx="13" ry="17" transform="rotate(-25 32 52)" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.7"/>
<ellipse cx="62" cy="52" rx="13" ry="17" transform="rotate(25 62 52)" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.7"/>
<ellipse cx="47" cy="74" rx="24" ry="17" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.7"/>
<ellipse cx="47" cy="94" rx="14" ry="6" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.7"/>
<circle cx="47" cy="86" r="2" fill="#fff" stroke="#4a5462" stroke-width="0.5"/>
<text x="47" y="116" text-anchor="middle" font-size="6.8" fill="#1d2430">Normal</text>
<text x="47" y="125" text-anchor="middle" font-size="6.4" fill="#5b6573">tegmentum ample</text>
<!-- PSP -->
<ellipse cx="106" cy="50" rx="13" ry="17" transform="rotate(-25 106 50)" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.7"/>
<ellipse cx="136" cy="50" rx="13" ry="17" transform="rotate(25 136 50)" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.7"/>
<path d="M108,66 Q116,72 113,82 Q121,92 129,82 Q126,72 134,66 Q121,60 108,66 Z" fill="#e5dcf7" stroke="#5b3fa0" stroke-width="0.8"/>
<ellipse cx="121" cy="91" rx="10" ry="4.5" fill="#e5dcf7" stroke="#5b3fa0" stroke-width="0.7"/>
<circle cx="121" cy="84" r="2.6" fill="#fff" stroke="#5b3fa0" stroke-width="0.5"/>
<text x="121" y="116" text-anchor="middle" font-size="6.8" fill="#5b3fa0" font-weight="700">PSP : Mickey Mouse</text>
<text x="121" y="125" text-anchor="middle" font-size="6.4" fill="#5b3fa0">bords concaves</text>
</g>
<!-- Panel C : pont -->
<g transform="translate(352,18)">
<rect x="0" y="0" width="168" height="134" rx="6" fill="#fff" stroke="#d5dae1" stroke-width="0.8"/>
<text x="8" y="13" font-size="8.2" font-weight="700" fill="#5b3fa0">C · Axial pont T2 / FLAIR</text>
<ellipse cx="34" cy="80" rx="16" ry="20" fill="#e7ebf0" stroke="#4a5462" stroke-width="0.6"/>
<ellipse cx="134" cy="80" rx="16" ry="20" fill="#e7ebf0" stroke="#4a5462" stroke-width="0.6"/>
<path d="M50,72 L64,70 M50,88 L64,90" stroke="#4a5462" stroke-width="0.6"/>
<path d="M104,70 L118,72 M104,90 L118,88" stroke="#4a5462" stroke-width="0.6"/>
<path d="M44,68 Q50,80 44,94" fill="none" stroke="#fff" stroke-width="3"/>
<path d="M124,68 Q118,80 124,94" fill="none" stroke="#fff" stroke-width="3"/>
<circle cx="84" cy="68" r="26" fill="#9aa6b5" stroke="#4a5462" stroke-width="0.7"/>
<line x1="84" y1="43" x2="84" y2="93" stroke="#fff" stroke-width="3"/>
<line x1="59" y1="66" x2="109" y2="66" stroke="#fff" stroke-width="3"/>
<path d="M78,96 L90,96 L88,104 L80,104 Z" fill="#fff" stroke="#4a5462" stroke-width="0.5"/>
<text x="84" y="116" text-anchor="middle" font-size="6.8" fill="#5b3fa0" font-weight="700">AMS : « hot cross bun »</text>
<text x="84" y="125" text-anchor="middle" font-size="6.6" fill="#1d2430">+ pont plat, PCM fins et hyper T2</text>
</g>
<!-- Panel D : SWI SN -->
<g transform="translate(0,160)">
<rect x="0" y="0" width="168" height="134" rx="6" fill="#fff" stroke="#d5dae1" stroke-width="0.8"/>
<text x="8" y="13" font-size="8.2" font-weight="700" fill="#5b3fa0">D · SWI 3 T · substance noire</text>
<g transform="translate(6,22)">
<path d="M10,30 Q22,14 42,22 Q46,36 38,52 Q22,58 10,30 Z" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.5"/>
<path d="M18,30 Q28,22 38,28 L36,44 Q30,48 24,46 Z" fill="#3a4250"/>
<path d="M30,34 q4,1 3,9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<text x="27" y="72" text-anchor="middle" font-size="6.8" fill="#1d2430">Normal : « queue</text>
<text x="27" y="81" text-anchor="middle" font-size="6.8" fill="#1d2430">d’hirondelle »</text>
<text x="27" y="90" text-anchor="middle" font-size="6.2" fill="#5b6573">hyper dorsolatéral</text>
</g>
<g transform="translate(84,22)">
<path d="M10,30 Q22,14 42,22 Q46,36 38,52 Q22,58 10,30 Z" fill="#cfd8e3" stroke="#4a5462" stroke-width="0.5"/>
<path d="M18,30 Q28,22 38,28 L36,44 Q30,48 24,46 Z" fill="#3a4250"/>
<text x="27" y="72" text-anchor="middle" font-size="6.8" fill="#5b3fa0" font-weight="700">Absente</text>
<text x="27" y="81" text-anchor="middle" font-size="6.6" fill="#5b3fa0">MP, DCL, AMS, PSP</text>
<text x="27" y="90" text-anchor="middle" font-size="6.2" fill="#5b6573">dégénératif ≠ MP seule</text>
</g>
<text x="84" y="126" text-anchor="middle" font-size="6.4" fill="#5b6573">hémi-mésencéphale gauche, SN postérieure</text>
</g>
<!-- Panel E : DaT -->
<g transform="translate(176,160)">
<rect x="0" y="0" width="168" height="134" rx="6" fill="#fff" stroke="#d5dae1" stroke-width="0.8"/>
<text x="8" y="13" font-size="8.2" font-weight="700" fill="#5b3fa0">E · DaTscan (FP-CIT)</text>
<rect x="8" y="22" width="72" height="62" rx="5" fill="#1d2430"/>
<rect x="88" y="22" width="72" height="62" rx="5" fill="#1d2430"/>
<!-- normal commas -->
<path d="M36,36 q-8,0 -8,8 q0,6 6,10 q2,8 6,16 q3,2 4,-2 q-1,-10 -2,-16 q2,-6 0,-12 q-2,-4 -6,-4z" fill="#f2b33d"/>
<path d="M52,36 q8,0 8,8 q0,6 -6,10 q-2,8 -6,16 q-3,2 -4,-2 q1,-10 2,-16 q-2,-6 0,-12 q2,-4 6,-4z" fill="#f2b33d"/>
<!-- MP: point droit (cote gauche du patient atteint = image droite selon convention radiologique) -->
<path d="M116,36 q-8,0 -8,8 q0,6 6,10 q2,8 6,16 q3,2 4,-2 q-1,-10 -2,-16 q2,-6 0,-12 q-2,-4 -6,-4z" fill="#f2b33d" opacity="0.9"/>
<path d="M116,58 q2,8 4,12 q3,2 4,-2 q-1,-8 -2,-12z" fill="#1d2430"/>
<circle cx="134" cy="44" r="6.5" fill="#e07a2a"/>
<path d="M128,50 q2,4 4,6" stroke="#7a3a1a" stroke-width="2" fill="none"/>
<text x="44" y="96" text-anchor="middle" font-size="6.8" fill="#1d2430">Normal : 2 virgules</text>
<text x="44" y="105" text-anchor="middle" font-size="6.4" fill="#5b6573">symétriques</text>
<text x="124" y="96" text-anchor="middle" font-size="6.8" fill="#5b3fa0" font-weight="700">Dégénératif : « point »</text>
<text x="124" y="105" text-anchor="middle" font-size="6.4" fill="#5b6573">perte putaminale</text>
<text x="84" y="119" text-anchor="middle" font-size="6.4" fill="#5b6573">MP : asymétrique, caudé préservé · PSP/AMS :</text>
<text x="84" y="127" text-anchor="middle" font-size="6.4" fill="#5b6573">plus symétrique, caudé atteint · ne les sépare pas</text>
</g>
<!-- Panel F : putamen AMS -->
<g transform="translate(352,160)">
<rect x="0" y="0" width="168" height="134" rx="6" fill="#fff" stroke="#d5dae1" stroke-width="0.8"/>
<text x="8" y="13" font-size="8.2" font-weight="700" fill="#5b3fa0">F · Putamen SWI / T2*</text>
<!-- midline -->
<line x1="84" y1="24" x2="84" y2="100" stroke="#d5dae1" stroke-width="0.6" stroke-dasharray="2 2"/>
<!-- left normal (image left) -->
<path d="M38,34 Q24,58 34,88 Q50,80 56,60 Q52,42 38,34 Z" fill="#9aa6b5" stroke="#4a5462" stroke-width="0.6"/>
<path d="M56,48 Q66,60 58,76 Q54,64 56,48 Z" fill="#6b7787" stroke="#4a5462" stroke-width="0.5"/>
<text x="42" y="110" text-anchor="middle" font-size="6.8" fill="#1d2430">Normal</text>
<text x="42" y="119" text-anchor="middle" font-size="6.2" fill="#5b6573">putamen ≥ pallidum</text>
<!-- right MSA -->
<path d="M132,38 Q144,58 136,86 Q122,78 118,60 Q120,46 132,38 Z" fill="#9aa6b5" stroke="#5b3fa0" stroke-width="0.7"/>
<path d="M136,62 Q140,74 136,86 Q128,82 126,72 Q130,66 136,62 Z" fill="#2b3240"/>
<path d="M132,38 Q144,58 136,86" fill="none" stroke="#fff" stroke-width="1.6"/>
<path d="M118,50 Q108,60 116,76 Q120,64 118,50 Z" fill="#6b7787" stroke="#4a5462" stroke-width="0.5"/>
<text x="126" y="110" text-anchor="middle" font-size="6.8" fill="#5b3fa0" font-weight="700">AMS-P</text>
<text x="126" y="119" text-anchor="middle" font-size="6.2" fill="#5b6573">hypo post. &lt; pallidum</text>
<text x="126" y="127" text-anchor="middle" font-size="6.2" fill="#5b6573">atrophie ± liseré (1,5 T)</text>
</g>
</svg>
