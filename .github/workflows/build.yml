name: Build classeur
on:
  push:
    branches: [main]
    paths: ['sources/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependances
        run: |
          pip install playwright segno pypdf
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          python3 -m playwright install --with-deps chromium
      - name: Build fiches, classeur, site
        run: |
          mkdir -p work/pdf && cp -r sources/src sources/web work/
          cp site/pdf/*.pdf work/pdf/
          cd work
          python3 src/build.py
          CH=$(ls "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux*/chrome)
          "$CH" --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=pdf/FO-01.pdf src/FO-01.html
          python3 src/binder.py
          python3 -c "import shutil; shutil.make_archive('Fiches-radiologie-par-organe','zip','.','Fiches-radiologie-par-organe')"
          python3 web/build_web.py
          cp web/extra/f/CV-02-cr.html site/f/CV-02-cr.html
      - name: Mise a jour du dossier site
        run: |
          rm -rf site
          cp -r work/site site
          rm -rf work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Rien a regenerer"; else
            git commit -m "Build automatique : PDF des fiches, classeur complet, zip par organe et site regeneres depuis les sources"
            git push
          fi
      - name: Publier la branche gh-pages
        run: |
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Publication automatique du site sur gh-pages"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
